<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alice in Wonderland QA System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
        }

        .question-form {
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .question-input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .question-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .ask-btn {
            padding: 15px 30px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .ask-btn:hover {
            transform: translateY(-2px);
        }

        .ask-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .samples-section {
            margin-bottom: 30px;
        }

        .samples-btn {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .samples-btn:hover {
            background: #e9ecef;
        }

        .samples-list {
            display: none;
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #f8f9fa;
        }

        .sample-question {
            padding: 10px 15px;
            border-bottom: 1px solid #e0e0e0;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .sample-question:hover {
            background: #e9ecef;
        }

        .sample-question:last-child {
            border-bottom: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .answer-section {
            display: none;
            margin-top: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 5px solid #667eea;
        }

        .question-display {
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .answer-text {
            line-height: 1.6;
            color: #444;
            margin-bottom: 15px;
        }

        .answer-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
            color: #666;
            border-top: 1px solid #e0e0e0;
            padding-top: 15px;
        }

        .confidence {
            font-weight: bold;
        }

        .confidence.high { color: #28a745; }
        .confidence.medium { color: #ffc107; }
        .confidence.low { color: #dc3545; }

        .sources-section {
            margin-top: 20px;
        }

        .sources-toggle {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            text-decoration: underline;
        }

        .sources-content {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .source-item {
            padding: 10px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 5px;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .error-message {
            display: none;
            padding: 15px;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            margin-top: 20px;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            border-top: 1px solid #e0e0e0;
            background: #f8f9fa;
        }

        @media (max-width: 600px) {
            .input-group {
                flex-direction: column;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .main-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐰 Alice in Wonderland</h1>
            <p>Question Answering System</p>
        </div>

        <div class="main-content">
            <div class="question-form">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="questionInput" 
                        class="question-input" 
                        placeholder="Ask me anything about Alice's Adventures in Wonderland..."
                        autofocus
                    >
                    <button id="askBtn" class="ask-btn">Ask Question</button>
                </div>
            </div>

            <div class="samples-section">
                <button id="samplesBtn" class="samples-btn">📝 Show Sample Questions</button>
                <div id="samplesList" class="samples-list"></div>
            </div>

            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Searching through Wonderland...</p>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <div id="answerSection" class="answer-section">
                <div id="questionDisplay" class="question-display"></div>
                <div id="answerText" class="answer-text"></div>
                <div class="answer-meta">
                    <span id="confidenceDisplay" class="confidence"></span>
                    <span id="sourcesInfo"></span>
                </div>
                <div class="sources-section">
                    <button id="sourcesToggle" class="sources-toggle">View Source Context</button>
                    <div id="sourcesContent" class="sources-content"></div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>Powered by RAG (Retrieval Augmented Generation) • OpenAI • HuggingFace</p>
        </div>
    </div>

    <script>
        // DOM elements
        const questionInput = document.getElementById('questionInput');
        const askBtn = document.getElementById('askBtn');
        const samplesBtn = document.getElementById('samplesBtn');
        const samplesList = document.getElementById('samplesList');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const answerSection = document.getElementById('answerSection');
        const questionDisplay = document.getElementById('questionDisplay');
        const answerText = document.getElementById('answerText');
        const confidenceDisplay = document.getElementById('confidenceDisplay');
        const sourcesInfo = document.getElementById('sourcesInfo');
        const sourcesToggle = document.getElementById('sourcesToggle');
        const sourcesContent = document.getElementById('sourcesContent');

        // Event listeners
        askBtn.addEventListener('click', askQuestion);
        questionInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                askQuestion();
            }
        });
        samplesBtn.addEventListener('click', toggleSamples);
        sourcesToggle.addEventListener('click', toggleSources);

        // Load sample questions on page load
        loadSampleQuestions();

        function showLoading() {
            loading.style.display = 'block';
            answerSection.style.display = 'none';
            errorMessage.style.display = 'none';
            askBtn.disabled = true;
        }

        function hideLoading() {
            loading.style.display = 'none';
            askBtn.disabled = false;
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            answerSection.style.display = 'none';
        }

        function showAnswer(data) {
            questionDisplay.textContent = `Q: ${data.question}`;
            answerText.textContent = data.answer;
            
            // Set confidence with color
            const confidence = data.confidence;
            confidenceDisplay.textContent = `Confidence: ${confidence}`;
            if (confidence >= 0.8) {
                confidenceDisplay.className = 'confidence high';
            } else if (confidence >= 0.5) {
                confidenceDisplay.className = 'confidence medium';
            } else {
                confidenceDisplay.className = 'confidence low';
            }

            sourcesInfo.textContent = `${data.num_sources} source passages`;

            // Populate sources
            sourcesContent.innerHTML = '';
            if (data.sources && data.sources.length > 0) {
                data.sources.forEach((source, index) => {
                    const sourceDiv = document.createElement('div');
                    sourceDiv.className = 'source-item';
                    sourceDiv.textContent = `Source ${index + 1}: ${source}`;
                    sourcesContent.appendChild(sourceDiv);
                });
                sourcesToggle.style.display = 'inline';
            } else {
                sourcesToggle.style.display = 'none';
            }

            answerSection.style.display = 'block';
            errorMessage.style.display = 'none';
        }

        async function askQuestion() {
            const question = questionInput.value.trim();
            if (!question) {
                showError('Please enter a question');
                return;
            }

            showLoading();

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ question: question })
                });

                const data = await response.json();

                if (data.success) {
                    showAnswer(data);
                } else {
                    showError(data.error || 'An error occurred');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        async function loadSampleQuestions() {
            try {
                const response = await fetch('/samples');
                const data = await response.json();

                if (data.success) {
                    samplesList.innerHTML = '';
                    data.samples.forEach(question => {
                        const div = document.createElement('div');
                        div.className = 'sample-question';
                        div.textContent = question;
                        div.addEventListener('click', () => {
                            questionInput.value = question;
                            samplesList.style.display = 'none';
                        });
                        samplesList.appendChild(div);
                    });
                }
            } catch (error) {
                console.error('Error loading sample questions:', error);
            }
        }

        function toggleSamples() {
            if (samplesList.style.display === 'none' || samplesList.style.display === '') {
                samplesList.style.display = 'block';
                samplesBtn.textContent = '📝 Hide Sample Questions';
            } else {
                samplesList.style.display = 'none';
                samplesBtn.textContent = '📝 Show Sample Questions';
            }
        }

        function toggleSources() {
            if (sourcesContent.style.display === 'none' || sourcesContent.style.display === '') {
                sourcesContent.style.display = 'block';
                sourcesToggle.textContent = 'Hide Source Context';
            } else {
                sourcesContent.style.display = 'none';
                sourcesToggle.textContent = 'View Source Context';
            }
        }
    </script>
</body>
</html>
